[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "priceguard"
version = "0.1.0"
description = "Synthetic position mark validation and exception reporting control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "typer>=0.9",
    "yfinance>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/priceguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
